<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Taniclei Pontes Ribas | Corretora de Imóveis</title>
<meta name="description" content="Casas e imóveis disponíveis com Taniclei Pontes Ribas, corretora de imóveis.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--pinho:#12352f;--pinho2:#1d4f46;--latao:#b8893b;--fundo:#f5f6f2;--tinta:#1c2321;--cinza:#68726f;--linha:#dde2dc;--br:12px}
*{box-sizing:border-box;margin:0}
body{font-family:Figtree,system-ui,sans-serif;background:var(--fundo);color:var(--tinta);line-height:1.55}
h1,h2,h3{font-family:'DM Serif Display',Georgia,serif;font-weight:400;line-height:1.15}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:3px solid var(--latao);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 20px;font-weight:600;text-decoration:none;background:var(--pinho);color:#fff}
.btn:hover{background:var(--pinho2)}
.btn.ouro{background:var(--latao)}.btn.ouro:hover{background:#a67a30}
.btn.zap{background:#1f9d55}.btn.zap:hover{background:#188246}
.btn.sec{background:#fff;color:var(--pinho);border:1px solid var(--linha)}
.btn.red{background:#b83a2e}
.btn.peq{padding:6px 12px;font-size:.88rem}
/* topo */
.top{background:var(--pinho);color:#fff;position:sticky;top:0;z-index:20}
.top .wrap{display:flex;align-items:center;justify-content:space-between;height:64px;gap:12px}
.logo{font-family:'DM Serif Display',serif;font-size:1.25rem;text-decoration:none}
.top nav{display:flex;gap:20px;align-items:center}
.top nav a{text-decoration:none;font-size:.95rem;opacity:.9}
.top nav a:hover{opacity:1;text-decoration:underline}
@media(max-width:640px){.top nav a:not(.btn){display:none}}
.hero{background:linear-gradient(105deg,rgba(18,53,47,.96) 45%,rgba(18,53,47,.7)),repeating-linear-gradient(90deg,#1d4f46 0 2px,transparent 2px 60px);color:#fff;padding:72px 0 96px}
.hero h1{font-size:clamp(2.2rem,5.5vw,3.8rem);max-width:15ch}
.hero p{max-width:46ch;margin:18px 0 28px;font-size:1.1rem;opacity:.9}
.hero .acoes{display:flex;gap:12px;flex-wrap:wrap}
/* busca */
.busca{background:#fff;border-radius:var(--br);box-shadow:0 10px 30px rgba(18,53,47,.15);padding:18px;margin-top:-52px;position:relative;display:grid;grid-template-columns:2fr repeat(4,1fr);gap:10px}
.busca input,.busca select{width:100%;padding:11px;border:1px solid var(--linha);border-radius:8px;background:#fff}
@media(max-width:900px){.busca{grid-template-columns:1fr 1fr}.busca input{grid-column:1/-1}}
.sec-t{display:flex;justify-content:space-between;align-items:end;margin:44px 0 18px;gap:10px;flex-wrap:wrap}
.sec-t h2{font-size:2rem}
.sec-t span{color:var(--cinza)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:22px}
.card{background:#fff;border-radius:var(--br);overflow:hidden;border:1px solid var(--linha);cursor:pointer;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.1)}
.ph{height:210px;background:linear-gradient(135deg,#d9e2dc,#c4d1c9);position:relative;display:grid;place-items:center;font-size:3rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:12px;top:12px;background:var(--pinho);color:#fff;font-size:.8rem;padding:3px 10px;border-radius:99px}
.tag.d{left:auto;right:12px;background:var(--latao)}
.vend{position:absolute;inset:0;background:rgba(18,53,47,.6);color:#fff;display:grid;place-items:center;font-family:'DM Serif Display',serif;font-size:1.8rem}
.cb{padding:16px}
.pr{font-size:1.4rem;font-weight:700;color:var(--pinho)}.pr small{font-size:.85rem;font-weight:500;color:var(--cinza)}
.cb h3{font-size:1.15rem;margin:4px 0}
.loc{color:var(--cinza);font-size:.92rem}
.ft{display:flex;gap:14px;margin-top:12px;padding-top:12px;border-top:1px solid var(--linha);font-size:.9rem;flex-wrap:wrap}
.vazio{grid-column:1/-1;text-align:center;padding:50px 10px;color:var(--cinza)}
/* sobre/contato */
.sobre{display:grid;grid-template-columns:1fr 1fr;gap:40px;margin:70px 0}
@media(max-width:800px){.sobre{grid-template-columns:1fr}}
.sobre h2{font-size:2rem;margin-bottom:12px}
.sobre p{white-space:pre-line;max-width:60ch}
.cx{background:#fff;border:1px solid var(--linha);border-radius:var(--br);padding:22px}
.cx label,.fm label{display:block;font-weight:600;font-size:.9rem;margin:12px 0 4px}
.cx input,.cx textarea,.fm input,.fm select,.fm textarea{width:100%;padding:10px;border:1px solid var(--linha);border-radius:8px;background:#fff}
.dados{list-style:none;padding:0;margin-top:18px;display:grid;gap:6px}
footer{background:var(--pinho);color:#dfe8e4;padding:28px 0;font-size:.9rem}
footer .wrap{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
footer a{opacity:.7}
.zapfix{position:fixed;right:18px;bottom:18px;z-index:30;width:56px;height:56px;border-radius:50%;background:#1f9d55;color:#fff;display:grid;place-items:center;font-size:1.7rem;text-decoration:none;box-shadow:0 6px 18px rgba(0,0,0,.3)}
/* modal */
.mod{position:fixed;inset:0;background:rgba(10,25,22,.75);z-index:50;overflow:auto;padding:20px}
.mod .box{background:#fff;max-width:900px;margin:0 auto;border-radius:var(--br);overflow:hidden;position:relative}
.fechar{position:absolute;right:12px;top:12px;z-index:3;width:38px;height:38px;border-radius:50%;border:0;background:#fff;font-size:1.3rem;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.gal{height:min(55vh,440px);background:#d9e2dc;display:grid;place-items:center;font-size:4rem}
.gal img{width:100%;height:100%;object-fit:cover}
.mini{display:flex;gap:6px;padding:8px;overflow-x:auto;background:#f0f2ee}
.mini img{width:80px;height:60px;object-fit:cover;border-radius:6px;cursor:pointer;opacity:.6;border:2px solid transparent}
.mini img.on{opacity:1;border-color:var(--latao)}
.mb{padding:24px}
.mb h2{font-size:1.9rem}
.mb .desc{white-space:pre-line;margin:16px 0;max-width:68ch}
.fatos{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin:16px 0}
.fatos div{background:var(--fundo);padding:10px;border-radius:8px;text-align:center}
.fatos b{display:block;font-size:1.2rem;color:var(--pinho)}
/* admin */
#admin{min-height:100vh;background:#eef0eb}
.ab{background:var(--pinho);color:#fff;padding:14px 0}
.ab .wrap{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:22px 0}
.tabs button{padding:9px 16px;border-radius:8px;border:1px solid var(--linha);background:#fff}
.tabs button.on{background:var(--pinho);color:#fff;border-color:var(--pinho)}
.pn{background:#fff;border-radius:var(--br);padding:22px;border:1px solid var(--linha);margin-bottom:30px}
.login{max-width:380px;margin:12vh auto;background:#fff;padding:30px;border-radius:var(--br);border:1px solid var(--linha)}
.tb{width:100%;border-collapse:collapse}
.tb th,.tb td{text-align:left;padding:10px 8px;border-bottom:1px solid var(--linha);vertical-align:middle}
.tb img,.tb .nf{width:64px;height:48px;object-fit:cover;border-radius:6px;background:#d9e2dc;display:grid;place-items:center}
.tbw{overflow-x:auto}
.ac{display:flex;gap:6px;flex-wrap:wrap}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 16px}
.fot{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fot div{position:relative}
.fot img{width:96px;height:72px;object-fit:cover;border-radius:8px;display:block}
.fot button{position:absolute;top:-6px;right:-6px;width:22px;height:22px;border-radius:50%;border:0;background:#b83a2e;color:#fff;font-size:.8rem}
.fot i{position:absolute;left:4px;bottom:4px;background:var(--latao);color:#fff;font-size:.7rem;padding:0 6px;border-radius:4px;font-style:normal}
.aviso{background:#fff7e0;border:1px solid #ecd48a;border-radius:8px;padding:12px;margin:12px 0;font-size:.93rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--tinta);color:#fff;padding:11px 20px;border-radius:8px;z-index:99}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<!-- ================= SITE DO VISITANTE ================= -->
<div id="site">
  <header class="top"><div class="wrap">
    <a class="logo" href="#" id="logoNome"></a>
    <nav><a href="#imoveis">Imóveis</a><a href="#sobre">Sobre</a><a href="#contato">Contato</a><a class="btn ouro peq" id="zapTopo" target="_blank" rel="noopener">WhatsApp</a></nav>
  </div></header>

  <section class="hero"><div class="wrap">
    <h1>Encontre a casa certa para a sua família</h1>
    <p id="heroTxt"></p>
    <div class="acoes"><a class="btn ouro" href="#imoveis">Ver imóveis disponíveis</a><a class="btn zap" id="zapHero" target="_blank" rel="noopener">Falar com a corretora</a></div>
  </div></section>

  <main class="wrap" id="imoveis">
    <div class="busca">
      <input id="q" type="search" placeholder="Buscar por bairro, cidade ou palavra" aria-label="Buscar" oninput="renderGrid()">
      <select id="fFin" aria-label="Finalidade" onchange="renderGrid()"><option value="">Comprar ou alugar</option><option>Venda</option><option>Aluguel</option></select>
      <select id="fTipo" aria-label="Tipo" onchange="renderGrid()"><option value="">Todos os tipos</option></select>
      <select id="fQuartos" aria-label="Quartos" onchange="renderGrid()"><option value="0">Quartos</option><option value="1">1 ou mais</option><option value="2">2 ou mais</option><option value="3">3 ou mais</option><option value="4">4 ou mais</option></select>
      <select id="fPreco" aria-label="Preço máximo" onchange="renderGrid()"><option value="0">Qualquer preço</option><option value="200000">até R$ 200 mil</option><option value="400000">até R$ 400 mil</option><option value="700000">até R$ 700 mil</option><option value="1000000">até R$ 1 milhão</option></select>
    </div>
    <div class="sec-t"><h2>Imóveis disponíveis</h2><span id="cont"></span></div>
    <div class="grid" id="grid"></div>

    <section class="sobre" id="sobre">
      <div><h2>Sobre a corretora</h2><p id="sobreTxt"></p></div>
      <div class="cx" id="contato">
        <h2 style="font-size:1.5rem">Fale comigo</h2>
        <label for="cNome">Seu nome</label><input id="cNome" autocomplete="name">
        <label for="cMsg">Mensagem</label><textarea id="cMsg" rows="4" placeholder="Conte o que você procura: tipo de imóvel, bairro, valor..."></textarea>
        <button class="btn zap" style="margin-top:14px;width:100%" onclick="enviarContato()">Enviar pelo WhatsApp</button>
        <ul class="dados" id="dados"></ul>
      </div>
    </section>
  </main>

  <footer><div class="wrap"><span id="rodape"></span><a href="#admin">Área da corretora</a></div></footer>
  <a class="zapfix" id="zapFix" target="_blank" rel="noopener" aria-label="Chamar no WhatsApp">💬</a>
</div>

<!-- ================= ÁREA ADMIN ================= -->
<div id="admin" hidden></div>
<div id="modal" class="mod" hidden></div>

<script>
/* ===== CONFIGURAÇÃO: troque a senha aqui antes de publicar ===== */
const SENHA = 'taniclei123';
/* =============================================================== */
const KEY = 'taniclei_dados_v1';
const TIPOS = ['Casa','Apartamento','Terreno','Sobrado','Chácara','Comercial'];
const DEMO = {
  config:{nome:'Taniclei Pontes Ribas',creci:'CRECI 00000',whats:'5542999999999',email:'',instagram:'',cidade:'Ponta Grossa - PR',
    sobre:'Sou Taniclei Pontes Ribas, corretora de imóveis. Ajudo famílias a comprar, vender e alugar com segurança, do primeiro contato até a entrega das chaves.\n\nAtendimento próximo, honesto e sem pressa. Me chame para conversar sobre o imóvel que você procura.'},
  imoveis:[
    {id:'d1',titulo:'Casa de 3 quartos com quintal',finalidade:'Venda',tipo:'Casa',preco:380000,bairro:'Oficinas',cidade:'Ponta Grossa',quartos:3,banheiros:2,vagas:2,area:150,descricao:'Casa ampla, com quintal gramado, churrasqueira e cozinha planejada.\nExemplo: apague e cadastre os seus imóveis na área da corretora.',fotos:[],destaque:true,status:'disponivel'},
    {id:'d2',titulo:'Apartamento próximo ao centro',finalidade:'Aluguel',tipo:'Apartamento',preco:1800,bairro:'Centro',cidade:'Ponta Grossa',quartos:2,banheiros:1,vagas:1,area:68,descricao:'Apartamento arejado, com sacada e portaria.',fotos:[],destaque:false,status:'disponivel'},
    {id:'d3',titulo:'Terreno plano 360 m²',finalidade:'Venda',tipo:'Terreno',preco:150000,bairro:'Uvaranas',cidade:'Ponta Grossa',quartos:0,banheiros:0,vagas:0,area:360,descricao:'Terreno plano, documentação em dia, pronto para construir.',fotos:[],destaque:false,status:'disponivel'}
  ]};
let D, fotosTmp = [], editId = null, aba = 'lista';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl = v => Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL',maximumFractionDigits:0});
const zapNum = () => String(D.config.whats||'').replace(/\D/g,'');
const zapLink = t => `https://wa.me/${zapNum()}?text=${encodeURIComponent(t)}`;
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.append(t);setTimeout(()=>t.remove(),2600)}

async function load(){
  try{const l=localStorage.getItem(KEY);if(l){D=JSON.parse(l);return}}catch(e){}
  try{const r=await fetch('imoveis.json?'+Date.now());if(r.ok){D=await r.json();return}}catch(e){}
  D=JSON.parse(JSON.stringify(DEMO));
}
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(D));return true}
  catch(e){alert('O navegador ficou sem espaço. Use menos fotos por imóvel ou apague imóveis antigos.');return false}
}

/* ===== Site do visitante ===== */
function renderSite(){
  const c=D.config;
  document.title=`${c.nome} | Corretora de Imóveis`;
  $('#logoNome').textContent=c.nome;
  $('#heroTxt').textContent=`${c.nome}, corretora de imóveis em ${c.cidade}. Veja as casas e imóveis disponíveis e fale direto comigo.`;
  $('#sobreTxt').textContent=c.sobre;
  const base=zapLink('Olá, vim pelo seu site e gostaria de mais informações.');
  ['#zapTopo','#zapHero','#zapFix'].forEach(s=>$(s).href=base);
  $('#dados').innerHTML=[c.whats&&`📱 WhatsApp: ${esc(c.whats)}`,c.email&&`✉️ ${esc(c.email)}`,c.instagram&&`📷 ${esc(c.instagram)}`,`📍 ${esc(c.cidade)}`].filter(Boolean).map(x=>`<li>${x}</li>`).join('');
  $('#rodape').textContent=`© ${new Date().getFullYear()} ${c.nome} · ${c.creci}`;
  const tipos=[...new Set([...TIPOS,...D.imoveis.map(i=>i.tipo)])];
  const sel=$('#fTipo'),v=sel.value;
  sel.innerHTML='<option value="">Todos os tipos</option>'+tipos.map(t=>`<option>${esc(t)}</option>`).join('');sel.value=v;
  renderGrid();
}
function card(i){
  const f=i.fotos&&i.fotos[0];
  return `<article class="card" tabindex="0" onclick="abrir('${i.id}')" onkeydown="if(event.key==='Enter')abrir('${i.id}')">
  <div class="ph">${f?`<img src="${f}" loading="lazy" alt="${esc(i.titulo)}">`:'🏠'}
  <b class="tag">${esc(i.finalidade)}</b>${i.destaque?'<b class="tag d">Destaque</b>':''}
  ${i.status==='vendido'?`<div class="vend">${i.finalidade==='Aluguel'?'Alugado':'Vendido'}</div>`:''}</div>
  <div class="cb"><div class="pr">${brl(i.preco)}${i.finalidade==='Aluguel'?' <small>/mês</small>':''}</div>
  <h3>${esc(i.titulo)}</h3><p class="loc">${esc(i.bairro)}, ${esc(i.cidade)}</p>
  <div class="ft"><span>🛏 ${i.quartos||0}</span><span>🚿 ${i.banheiros||0}</span><span>🚗 ${i.vagas||0}</span><span>📐 ${i.area||0} m²</span></div></div></article>`;
}
function renderGrid(){
  const q=$('#q').value.toLowerCase().trim(),fin=$('#fFin').value,tp=$('#fTipo').value,qt=+$('#fQuartos').value,pm=+$('#fPreco').value;
  const l=D.imoveis.filter(i=>(!fin||i.finalidade===fin)&&(!tp||i.tipo===tp)&&(i.quartos||0)>=qt&&(!pm||i.preco<=pm)&&
    (!q||[i.titulo,i.bairro,i.cidade,i.descricao,i.tipo].join(' ').toLowerCase().includes(q)))
    .sort((a,b)=>(a.status==='vendido')-(b.status==='vendido')||(b.destaque-a.destaque));
  $('#cont').textContent=l.length+(l.length===1?' imóvel':' imóveis');
  $('#grid').innerHTML=l.length?l.map(card).join(''):'<p class="vazio">Nenhum imóvel encontrado com esses filtros. Tente limpar a busca ou fale comigo no WhatsApp.</p>';
}
function abrir(id){
  const i=D.imoveis.find(x=>x.id===id);if(!i)return;
  const fs=i.fotos||[];
  $('#modal').innerHTML=`<div class="box"><button class="fechar" onclick="fechar()" aria-label="Fechar">✕</button>
  <div class="gal" id="galP">${fs[0]?`<img src="${fs[0]}" alt="">`:'🏠'}</div>
  ${fs.length>1?`<div class="mini">${fs.map((f,n)=>`<img src="${f}" class="${n?'':'on'}" onclick="foto(${n},this)" alt="Foto ${n+1}">`).join('')}</div>`:''}
  <div class="mb"><div class="pr" style="font-size:1.7rem">${brl(i.preco)}${i.finalidade==='Aluguel'?' <small>/mês</small>':''}</div>
  <h2>${esc(i.titulo)}</h2><p class="loc">${esc(i.tipo)} para ${esc(i.finalidade.toLowerCase())} · ${esc(i.bairro)}, ${esc(i.cidade)}</p>
  <div class="fatos"><div><b>${i.quartos||0}</b>Quartos</div><div><b>${i.banheiros||0}</b>Banheiros</div><div><b>${i.vagas||0}</b>Vagas</div><div><b>${i.area||0} m²</b>Área</div></div>
  <p class="desc">${esc(i.descricao)}</p>
  <a class="btn zap" target="_blank" rel="noopener" href="${zapLink(`Olá! Tenho interesse no imóvel "${i.titulo}" (${i.bairro}) anunciado no seu site.`)}">Tenho interesse, chamar no WhatsApp</a></div></div>`;
  window._fs=fs;$('#modal').hidden=false;document.body.style.overflow='hidden';
}
function foto(n,el){$('#galP').innerHTML=`<img src="${window._fs[n]}" alt="">`;document.querySelectorAll('.mini img').forEach(x=>x.classList.remove('on'));el.classList.add('on')}
function fechar(){$('#modal').hidden=true;document.body.style.overflow=''}
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')fechar()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});
function enviarContato(){
  const n=$('#cNome').value.trim(),m=$('#cMsg').value.trim();
  if(!m){toast('Escreva uma mensagem');return}
  window.open(zapLink(`Olá, sou ${n||'um visitante do site'}. ${m}`),'_blank');
}

/* ===== Área da corretora ===== */
const logado=()=>sessionStorage.getItem('adm')==='1';
function rota(){
  const adm=location.hash==='#admin';
  $('#site').hidden=adm;$('#admin').hidden=!adm;
  if(adm){window.scrollTo(0,0);renderAdmin()}
}
function renderAdmin(){
  const A=$('#admin');
  if(!logado()){
    A.innerHTML=`<div class="login"><h2 style="font-size:1.7rem">Área da corretora</h2><p style="color:var(--cinza);margin:6px 0 14px">Digite a senha para gerenciar os imóveis.</p>
    <div class="fm"><label for="sn">Senha</label><input id="sn" type="password" autocomplete="current-password" onkeydown="if(event.key==='Enter')entrar()"></div>
    <button class="btn" style="width:100%;margin-top:16px" onclick="entrar()">Entrar</button>
    <p style="margin-top:14px;text-align:center"><a href="#">Voltar ao site</a></p></div>`;
    return;
  }
  const tabs=[['lista','Meus imóveis'],['form',editId?'Editar imóvel':'Cadastrar imóvel'],['conf','Meus dados'],['pub','Publicar no site']];
  A.innerHTML=`<div class="ab"><div class="wrap"><b style="font-size:1.1rem">Painel de ${esc(D.config.nome)}</b>
  <span><a class="btn sec peq" href="#">Ver site</a> <button class="btn sec peq" onclick="sair()">Sair</button></span></div></div>
  <div class="wrap"><div class="tabs">${tabs.map(([k,t])=>`<button class="${aba===k?'on':''}" onclick="irAba('${k}')">${t}</button>`).join('')}</div>
  <div class="pn" id="painel"></div></div>`;
  ({lista:pLista,form:pForm,conf:pConf,pub:pPub})[aba]();
}
function entrar(){if($('#sn').value===SENHA){sessionStorage.setItem('adm','1');renderAdmin()}else toast('Senha incorreta')}
function sair(){sessionStorage.removeItem('adm');location.hash='';}
function irAba(k){if(k==='form'&&aba!=='form'){editId=null;fotosTmp=[]}aba=k;renderAdmin()}

function pLista(){
  const l=D.imoveis;
  $('#painel').innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;flex-wrap:wrap;gap:8px"><h2 style="font-size:1.5rem">${l.length} ${l.length===1?'imóvel cadastrado':'imóveis cadastrados'}</h2><button class="btn ouro" onclick="novo()">+ Cadastrar imóvel</button></div>
  ${l.length?`<div class="tbw"><table class="tb"><thead><tr><th></th><th>Imóvel</th><th>Preço</th><th>Situação</th><th>Ações</th></tr></thead><tbody>
  ${l.map(i=>`<tr><td>${i.fotos&&i.fotos[0]?`<img src="${i.fotos[0]}" alt="">`:'<div class="nf">🏠</div>'}</td>
  <td><b>${esc(i.titulo)}</b><br><small style="color:var(--cinza)">${esc(i.tipo)} · ${esc(i.finalidade)} · ${esc(i.bairro)}${i.destaque?' · ⭐ Destaque':''}</small></td>
  <td>${brl(i.preco)}</td><td>${i.status==='vendido'?(i.finalidade==='Aluguel'?'Alugado':'Vendido'):'Disponível'}</td>
  <td><div class="ac"><button class="btn sec peq" onclick="editar('${i.id}')">Editar</button><button class="btn sec peq" onclick="alt('${i.id}')">${i.status==='vendido'?'Reabrir':'Marcar '+(i.finalidade==='Aluguel'?'alugado':'vendido')}</button><button class="btn red peq" onclick="apagar('${i.id}')">Excluir</button></div></td></tr>`).join('')}
  </tbody></table></div>`:'<p class="vazio">Nenhum imóvel ainda. Clique em “Cadastrar imóvel” para começar.</p>'}`;
}
function novo(){editId=null;fotosTmp=[];aba='form';renderAdmin()}
function editar(id){editId=id;fotosTmp=[...(D.imoveis.find(i=>i.id===id).fotos||[])];aba='form';renderAdmin()}
function alt(id){const i=D.imoveis.find(x=>x.id===id);i.status=i.status==='vendido'?'disponivel':'vendido';save();renderAdmin();toast('Situação atualizada')}
function apagar(id){if(confirm('Excluir este imóvel? Isso não pode ser desfeito.')){D.imoveis=D.imoveis.filter(i=>i.id!==id);save();renderAdmin();toast('Imóvel excluído')}}

function pForm(){
  const i=editId?D.imoveis.find(x=>x.id===editId):{finalidade:'Venda',tipo:'Casa',status:'disponivel',cidade:D.config.cidade.split(' - ')[0]};
  const num=(id,l,v)=>`<div><label for="${id}">${l}</label><input id="${id}" type="number" min="0" value="${v??''}"></div>`;
  $('#painel').innerHTML=`<div class="fm"><div class="f2">
  <div style="grid-column:1/-1"><label for="f_titulo">Título do anúncio</label><input id="f_titulo" value="${esc(i.titulo)}" placeholder="Ex.: Casa de 3 quartos com quintal"></div>
  <div><label for="f_fin">Finalidade</label><select id="f_fin"><option ${i.finalidade==='Venda'?'selected':''}>Venda</option><option ${i.finalidade==='Aluguel'?'selected':''}>Aluguel</option></select></div>
  <div><label for="f_tipo">Tipo</label><select id="f_tipo">${TIPOS.map(t=>`<option ${i.tipo===t?'selected':''}>${t}</option>`).join('')}</select></div>
  ${num('f_preco','Preço (R$)',i.preco)}
  <div><label for="f_bairro">Bairro</label><input id="f_bairro" value="${esc(i.bairro)}"></div>
  <div><label for="f_cidade">Cidade</label><input id="f_cidade" value="${esc(i.cidade)}"></div>
  ${num('f_q','Quartos',i.quartos)}${num('f_b','Banheiros',i.banheiros)}${num('f_v','Vagas de garagem',i.vagas)}${num('f_a','Área (m²)',i.area)}
  <div style="grid-column:1/-1"><label for="f_desc">Descrição</label><textarea id="f_desc" rows="5" placeholder="Fale dos cômodos, acabamento, documentação, pontos fortes...">${esc(i.descricao)}</textarea></div>
  <div style="grid-column:1/-1"><label for="f_fotos">Fotos (a primeira é a capa)</label><input id="f_fotos" type="file" accept="image/*" multiple onchange="addFotos(this)">
  <div class="fot" id="fot"></div></div>
  <div><label><input type="checkbox" id="f_dest" style="width:auto" ${i.destaque?'checked':''}> Mostrar como destaque</label></div>
  <div><label><input type="checkbox" id="f_vend" style="width:auto" ${i.status==='vendido'?'checked':''}> Já vendido / alugado</label></div>
  </div><div style="margin-top:20px;display:flex;gap:10px"><button class="btn ouro" onclick="salvarImovel()">Salvar imóvel</button><button class="btn sec" onclick="irAba('lista')">Cancelar</button></div></div>`;
  desenhaFotos();
}
function desenhaFotos(){
  $('#fot').innerHTML=fotosTmp.map((f,n)=>`<div><img src="${f}" alt="">${n?'':'<i>Capa</i>'}<button onclick="rmFoto(${n})" aria-label="Remover foto">✕</button></div>`).join('');
}
function rmFoto(n){fotosTmp.splice(n,1);desenhaFotos()}
function addFotos(inp){
  [...inp.files].forEach(file=>{
    const r=new FileReader();
    r.onload=()=>{const im=new Image();im.onload=()=>{
      const s=Math.min(1,900/Math.max(im.width,im.height)),c=document.createElement('canvas');
      c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      fotosTmp.push(c.toDataURL('image/jpeg',.72));desenhaFotos()};im.src=r.result};
    r.readAsDataURL(file);
  });inp.value='';
}
function salvarImovel(){
  const g=id=>$('#'+id).value.trim();
  if(!g('f_titulo')||!g('f_preco')){toast('Preencha o título e o preço');return}
  const o={id:editId||'i'+Date.now(),titulo:g('f_titulo'),finalidade:g('f_fin'),tipo:g('f_tipo'),preco:+g('f_preco'),bairro:g('f_bairro'),cidade:g('f_cidade'),
    quartos:+g('f_q')||0,banheiros:+g('f_b')||0,vagas:+g('f_v')||0,area:+g('f_a')||0,descricao:g('f_desc'),fotos:fotosTmp,
    destaque:$('#f_dest').checked,status:$('#f_vend').checked?'vendido':'disponivel'};
  const idx=D.imoveis.findIndex(x=>x.id===o.id);
  idx>=0?D.imoveis[idx]=o:D.imoveis.unshift(o);
  if(!save())return;
  editId=null;fotosTmp=[];aba='lista';renderAdmin();toast('Imóvel salvo');
}
function pConf(){
  const c=D.config,f=(id,l,v,ph='')=>`<div><label for="${id}">${l}</label><input id="${id}" value="${esc(v)}" placeholder="${ph}"></div>`;
  $('#painel').innerHTML=`<div class="fm"><div class="f2">${f('c_nome','Nome',c.nome)}${f('c_creci','CRECI',c.creci)}${f('c_whats','WhatsApp (com DDD)',c.whats,'5542999999999')}${f('c_email','E-mail',c.email)}${f('c_insta','Instagram',c.instagram,'@seuperfil')}${f('c_cidade','Cidade de atuação',c.cidade)}
  <div style="grid-column:1/-1"><label for="c_sobre">Texto “Sobre a corretora”</label><textarea id="c_sobre" rows="6">${esc(c.sobre)}</textarea></div></div>
  <p class="aviso">No WhatsApp, use o código do país antes: 55 + DDD + número. Exemplo: 5542999998888.</p>
  <button class="btn ouro" onclick="salvarConf()">Salvar dados</button></div>`;
}
function salvarConf(){
  const g=id=>$('#'+id).value.trim();
  D.config={nome:g('c_nome'),creci:g('c_creci'),whats:g('c_whats'),email:g('c_email'),instagram:g('c_insta'),cidade:g('c_cidade'),sobre:$('#c_sobre').value};
  save();renderSite();renderAdmin();toast('Dados salvos');
}
function pPub(){
  $('#painel').innerHTML=`<h2 style="font-size:1.5rem;margin-bottom:8px">Publicar no site</h2>
  <p class="aviso"><b>Importante:</b> o que você cadastra aqui fica salvo só neste navegador. Para os visitantes verem as mudanças, baixe o arquivo abaixo e envie para o GitHub.</p>
  <ol style="margin:0 0 18px 20px;display:grid;gap:6px"><li>Clique em <b>Baixar imoveis.json</b>.</li><li>No GitHub, abra o repositório do site e clique em <b>Add file → Upload files</b>.</li><li>Envie o arquivo <b>imoveis.json</b> (substitui o anterior) e clique em <b>Commit changes</b>.</li><li>Em 1 ou 2 minutos o site está atualizado.</li></ol>
  <div class="ac"><button class="btn ouro" onclick="baixar()">Baixar imoveis.json</button>
  <label class="btn sec" style="cursor:pointer">Restaurar de um arquivo<input type="file" accept=".json" hidden onchange="importar(this)"></label>
  <button class="btn red" onclick="zerar()">Apagar dados deste navegador</button></div>`;
}
function baixar(){
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D)],{type:'application/json'}));
  a.download='imoveis.json';a.click();toast('Arquivo baixado');
}
function importar(inp){
  const f=inp.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const j=JSON.parse(r.result);if(!j.imoveis||!j.config)throw 0;D=j;save();renderSite();renderAdmin();toast('Dados restaurados')}catch(e){alert('Arquivo inválido.')}};
  r.readAsText(f);
}
function zerar(){if(confirm('Apagar tudo que está salvo neste navegador? O site volta ao último imoveis.json publicado.')){localStorage.removeItem(KEY);location.reload()}}

window.addEventListener('hashchange',rota);
load().then(()=>{renderSite();rota()});
</script>
</body>
</html>
